version: '3.1'

services:
  db:
    image: postgres:15
    container_name: odoo_db
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    image: python:3.10
    container_name: odoo_app
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - .:/opt/odoo
    working_dir: /opt/odoo
    command: >
      bash -c "
      pip install --upgrade pip &&
      pip install -r requirements.txt &&
      python3 odoo-bin
      "
    environment:
      DB_HOST: db
      DB_USER: odoo
      DB_PASSWORD: odoo

volumes:
  odoo_db_data:
