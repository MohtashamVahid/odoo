version: "3.9"

services:
  db:
    image: postgres:16
    container_name: odoo_db
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - odoo_db_data:/var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: odoo_app
    depends_on:
      - db
    environment:
      PGHOST: ${PGHOST:-db}
      PGPORT: ${PGPORT:-5432}
      PGUSER: ${PGUSER:-odoo}
      PGPASSWORD: ${PGPASSWORD:-odoo}
      PGDATABASE: ${PGDATABASE:-odoo}
    ports:
      - "8069:8069"
    volumes:
      - .:/opt/odoo
    working_dir: /opt/odoo
    command: >
      bash -c "
      until pg_isready -h \"$$PGHOST\" -p \"$$PGPORT\" -U \"$$PGUSER\" -d \"$$PGDATABASE\"; do
        echo 'waiting for database...';
        sleep 2;
      done;
      exec python3 odoo-bin
        --db_host=$$PGHOST
        --db_port=$$PGPORT
        --db_user=$$PGUSER
        --db_password=$$PGPASSWORD
        --http-port=8069
      "

volumes:
  odoo_db_data:
